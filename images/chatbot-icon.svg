<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Exact TT Clinics 3D Orange Ping-Pong Ball Gradient -->
    <radialGradient id="ttBallGrad" cx="32%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="16%" stop-color="#fff0e6"/>
      <stop offset="38%" stop-color="#ff8a33"/>
      <stop offset="70%" stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#b83d00"/>
    </radialGradient>
    
    <filter id="ttIconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 3D Ball Base (The signature TT Clinics Badge) -->
  <circle cx="50" cy="50" r="47" fill="url(#ttBallGrad)"/>

  <!-- Pure White Outline Icon (Exact Website Stroke Style: stroke-width=2.2, stroke=white) -->
  <g transform="translate(23, 23) scale(2.25)" stroke="#ffffff" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#ttIconGlow)">
    <!-- Antenna with small ball -->
    <path d="M12 2v4"/>
    <circle cx="12" cy="2" r="1.5" fill="#ffffff"/>
    <!-- Robot Head Frame -->
    <rect x="4" y="6" width="16" height="12" rx="3"/>
    <!-- Eyes -->
    <circle cx="9" cy="11" r="1.2" fill="#ffffff"/>
    <circle cx="15" cy="11" r="1.2" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M9 14.5c1 .8 2 1 3 1s2-.2 3-1"/>
    <!-- Side Transponders -->
    <path d="M2 12h2"/>
    <path d="M20 12h2"/>
  </g>
</svg>