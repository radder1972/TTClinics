<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- TT Orange Ball 3D Radial Gradient -->
    <radialGradient id="ballGrad" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FFAE5C"/>
      <stop offset="35%" stop-color="#FF6B00"/>
      <stop offset="80%" stop-color="#D14200"/>
      <stop offset="100%" stop-color="#9E2F00"/>
    </radialGradient>

    <!-- Sleek Titanium/Carbon Visor Gradient -->
    <linearGradient id="visorCarbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Cyan Laser Glow -->
    <filter id="cyberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Drop Shadow for depth -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Abstract Speed Orbit Trail (The pingpong ball smash trajectory) -->
    <path d="M14 26 C26 10, 68 8, 86 22" fill="none" stroke="#FF8533" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
    <path d="M10 38 C16 20, 52 12, 78 16" fill="none" stroke="#FFA04D" stroke-width="2" stroke-linecap="round" opacity="0.35"/>

    <!-- The Table Tennis Ball Core (Main Head Sphere) -->
    <circle cx="50" cy="52" r="35" fill="url(#ballGrad)"/>

    <!-- Subtle TT Seam Highlight Curve -->
    <path d="M24 38 C35 26, 65 26, 76 38" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>

    <!-- Robot Top Antenna / AI Sensor Spike -->
    <line x1="50" y1="19" x2="50" y2="8" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <circle cx="50" cy="6" r="3.5" fill="#00F0FF" filter="url(#cyberGlow)"/>

    <!-- Geometric Cyber Crown / Head Bracket -->
    <path d="M22 37 C32 24, 68 24, 78 37" fill="none" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M25 37 C34 26, 66 26, 75 37" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

    <!-- The Robot Visor: Ultra-Clean Angular Cyber Shield -->
    <!-- Visor Beveled Outer Frame -->
    <path d="M14 50 L25 43 L75 43 L86 50 L78 63 L50 66 L22 63 Z" 
          fill="url(#visorCarbon)" stroke="#334155" stroke-width="2" stroke-linejoin="round"/>
    
    <!-- Visor Front Recess (Dark inner aperture) -->
    <path d="M26 46 L74 46 L78 52 L70 61 L30 61 L22 52 Z" fill="#040711"/>

    <!-- Futuristic Diagonal Lens Reflection -->
    <path d="M29 48 L46 48 L36 59 L25 59 Z" fill="#FFFFFF" opacity="0.12"/>

    <!-- Glowing Cybernetic LED Eyes (Twin Sharp Horizontal Laser Slits) -->
    <path d="M32 53.5 L43 53.5" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" filter="url(#cyberGlow)"/>
    <circle cx="50" cy="53.5" r="2" fill="#00F0FF" filter="url(#cyberGlow)"/>
    <path d="M57 53.5 L68 53.5" stroke="#00F0FF" stroke-width="3.5" stroke-linecap="round" filter="url(#cyberGlow)"/>

    <!-- Micro Audio / Sensor Nodes on Sides (Streamlined) -->
    <rect x="11" y="46" width="4.5" height="11" rx="2.2" fill="#FF6B00"/>
    <rect x="84.5" y="46" width="4.5" height="11" rx="2.2" fill="#FF6B00"/>

    <!-- Specular Ball Highlight (Top Left) -->
    <ellipse cx="36" cy="32" rx="6" ry="3" transform="rotate(-35 36 32)" fill="#FFFFFF" opacity="0.45"/>

    <!-- Minimalist Chin Sensor / Subtle Smiling Notch -->
    <path d="M46 72 L50 75 L54 72" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>